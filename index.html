<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CDE Ontology Map</title>
<meta name="description" content="Unofficial 3D viewer of the draft ACR-RSNA next-gen CDE ontology map, loaded live from the RSNA GitHub repository.">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CDE Map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Layout: full-screen 3D map; a slim top bar with search and controls; details slide up from the bottom */
  :root {
    --space: #07090f;
    --glass: rgba(18, 22, 31, 0.86);
    --line: rgba(255, 255, 255, 0.10);
    --text: #e8eaee;
    --muted: #9aa2ae;
    --accent: #7cc4ff;
    --warn: #f0b429;
    --error: #ef6b6b;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--space); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #stars, #graph, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; z-index: 2; }
  #graph { z-index: 1; }

  #bar {
    position: fixed; z-index: 5; left: 0; right: 0; top: 0;
    padding: calc(var(--top) + 8px) 12px 8px; display: flex; gap: 8px; align-items: center;
    background: linear-gradient(to bottom, rgba(7,9,15,0.92), rgba(7,9,15,0.55) 75%, rgba(7,9,15,0));
  }
  #searchWrap { position: relative; flex: 1 1 auto; min-width: 0; }
  #search {
    width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--glass); color: var(--text); font-size: 16px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #results {
    position: absolute; left: 0; right: 0; top: 44px; max-height: 50vh; overflow-y: auto;
    background: #12161f; border: 1px solid var(--line); border-radius: 10px; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #results.open { display: block; }
  #results button {
    display: flex; gap: 8px; align-items: center; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--text); text-align: left; font-size: 15px; cursor: pointer;
  }
  #results button:active, #results button:hover { background: rgba(124,196,255,.12); }
  #results .none { padding: 12px; color: var(--muted); font-size: 14px; }
  .btn {
    flex: 0 0 auto; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--glass); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible, #results button:focus-visible, .rel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #status {
    position: fixed; z-index: 4; left: 12px; right: 12px; top: calc(var(--top) + 54px);
    font-size: 12px; color: var(--muted); pointer-events: none; text-shadow: 0 1px 3px #000;
  }
  #status.warn { color: var(--warn); }
  #status.error { color: var(--error); }
  #status.hint { color: var(--accent); }

  #types {
    position: fixed; z-index: 4; left: 12px; right: 12px; top: calc(var(--top) + 76px);
    display: none; flex-wrap: wrap; gap: 6px; max-height: 40vh; overflow-y: auto;
    padding: 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
  }
  #types.open { display: flex; }
  #types button {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 12px; cursor: pointer;
  }
  #types button.active { border-color: #fff; background: rgba(255,255,255,.08); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

  #panel {
    position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; max-height: 46vh;
    display: flex; flex-direction: column;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    padding: 12px 14px calc(var(--bottom) + 12px);
    transform: translateY(105%); transition: transform .25s ease;
  }
  #panel.open { transform: translateY(0); }
  @media (min-width: 820px) {
    #panel { left: auto; right: 12px; top: calc(var(--top) + 64px); bottom: 12px; width: 360px; max-height: none; border-radius: 14px; border: 1px solid var(--line); transform: translateX(110%); }
    #panel.open { transform: translateX(0); }
    #types { right: auto; max-width: 560px; }
  }
  #panelHead { display: flex; align-items: flex-start; gap: 10px; }
  #panelHead .dot { width: 14px; height: 14px; margin-top: 4px; }
  #pName { font-size: 17px; font-weight: 650; line-height: 1.25; text-wrap: balance; }
  #pType { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: .02em; }
  #pClose { margin-left: auto; height: 32px; min-width: 32px; padding: 0 10px; font-size: 13px; }
  #pActions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  #pActions .btn { height: 32px; padding: 0 10px; font-size: 13px; }
  #steps { display: flex; align-items: center; gap: 4px; margin-left: 4px; font-size: 12px; color: var(--muted); }
  #steps .btn { min-width: 34px; padding: 0 8px; }
  #pActions[hidden], #steps[hidden] { display: none; }
  .group.from { color: #f0b429; }
  .group.to { color: #5fd4c4; }
  .away { margin: 6px 0 0 6px; font-size: 11px; color: var(--muted); }
  .pick { margin: 2px 0 12px; font-size: 15px; line-height: 1.4; }
  .step { padding: 2px 6px 2px 30px; font-size: 12px; color: var(--muted); }
  #rels { overflow-y: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
  .group { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .rel {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 6px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text); font-size: 15px; text-align: left; cursor: pointer;
  }
  .rel:hover, .rel:active { background: rgba(124,196,255,.12); }
  .rel .dir { color: var(--muted); font-size: 13px; width: 16px; flex: 0 0 auto; text-align: center; }
  .rel .via { color: var(--muted); font-size: 13px; }
  #note { margin-top: 10px; font-size: 11px; color: var(--muted); }
  #note a { color: var(--muted); }

  #message { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); font-size: 15px; pointer-events: none; }
  #message[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="graph" aria-label="3D map of CDE concepts"></div>
<canvas id="labels" aria-hidden="true"></canvas>

<div id="bar">
  <div id="searchWrap">
    <input id="search" type="search" autocomplete="off" placeholder="Search concepts" aria-label="Search concepts">
    <div id="results" role="listbox"></div>
  </div>
  <button id="typesBtn" class="btn" aria-pressed="false" title="Highlight a concept type">Types</button>
  <button id="spinBtn" class="btn" aria-pressed="false" title="Spin the map">Spin</button>
  <button id="fitBtn" class="btn" title="Show the whole map">Reset</button>
</div>
<div id="status">Checking GitHub for the latest map…</div>
<div id="types" role="group" aria-label="Concept types"></div>
<div id="message">Loading the map…</div>

<section id="panel" aria-live="polite">
  <div id="panelHead">
    <span class="dot" id="pDot"></span>
    <div><div id="pName"></div><div id="pType"></div></div>
    <button id="pClose" class="btn">Close</button>
  </div>
  <div id="pActions">
    <button id="pTrace" class="btn" aria-pressed="false" title="Show everything that leads into and out of this concept">Trace</button>
    <button id="pPath" class="btn" title="Find how this concept connects to another one">Find path</button>
    <div id="steps" role="group" aria-label="How many steps to follow" hidden>Steps
      <button class="btn" type="button" data-depth="1">1</button>
      <button class="btn" type="button" data-depth="2">2</button>
      <button class="btn" type="button" data-depth="3">3</button>
      <button class="btn" type="button" data-depth="0">All</button>
    </div>
  </div>
  <div id="rels"></div>
  <div id="note">Unofficial viewer of the draft ACR-RSNA next-gen map, loaded live from the <a href="https://github.com/RSNA/ACR-RSNA-CDEs/tree/next-gen-2026/docs/next-gen-schema/alpha/visualizations" target="_blank" rel="noopener">RSNA repository</a>.</div>
</section>

<script src="lib/3d-force-graph-1.80.1.min.js"></script>
<script src="map-data.js"></script>
<script>
(function () {
  "use strict";
  var SOURCE = "https://raw.githubusercontent.com/RSNA/ACR-RSNA-CDEs/next-gen-2026/docs/next-gen-schema/alpha/visualizations/ontology_map.html";
  var COMMITS = "https://api.github.com/repos/RSNA/ACR-RSNA-CDEs/commits?sha=next-gen-2026&per_page=1&path=docs/next-gen-schema/alpha/visualizations/ontology_map.html";
  var CACHE = "cde-map-v2";
  var GOOD_KEY = "/last-good-map.json";
  // Concepts and links outside the current focus stay visible in grey, so you can tap into another branch
  var DIM = "#4a5160";
  var CONTEXT_DIM = "#7d8695";
  var DIM_LINK = "rgba(150,160,175,0.10)";

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), messageEl = $("message");

  function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = kind || ""; }

  // ---------- starfield ----------
  (function stars() {
    var c = $("stars"), ctx = c.getContext("2d");
    function draw() {
      var dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
      c.width = w * dpr; c.height = h * dpr; c.style.width = w + "px"; c.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var g = ctx.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, Math.max(w, h) * 0.75);
      g.addColorStop(0, "#111827"); g.addColorStop(1, "#05070c");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      var seed = 42; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      var n = Math.round(w * h / 2600);
      for (var i = 0; i < n; i++) {
        var r = rnd() < 0.92 ? 0.6 : 1.2;
        ctx.globalAlpha = 0.25 + rnd() * 0.6;
        ctx.fillStyle = rnd() < 0.15 ? "#bcd7ff" : "#ffffff";
        ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    draw(); addEventListener("resize", draw);
  })();

  // ---------- loading the RSNA data ----------
  var extractData = window.CDEMapData && CDEMapData.extractData;

  function openCache() { return ("caches" in window) ? caches.open(CACHE).catch(function () { return null; }) : Promise.resolve(null); }
  function readGood(cache) {
    if (!cache) return Promise.resolve(null);
    return cache.match(GOOD_KEY).then(function (r) { return r ? r.json() : null; }).catch(function () { return null; });
  }
  function saveGood(cache, payload) {
    if (!cache) return;
    cache.put(GOOD_KEY, new Response(JSON.stringify(payload), { headers: { "content-type": "application/json" } })).catch(function () {});
  }
  function fetchCommitDate() {
    return fetch(COMMITS, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : []; }).then(function (j) {
      var d = j && j[0] && j[0].commit && j[0].commit.committer && j[0].commit.committer.date;
      return d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
    }).catch(function () { return ""; });
  }
  function hashString(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

  // ---------- RSNA focus rules (ported from the RSNA ontology_map.html controls) ----------
  var nodeById = {}, edgeIndex = {};
  function typeOf(id) { var n = nodeById[id]; return n ? n.type : "generic"; }
  function otherEnd(e, id) { return e.from === id ? e.to : e.from; }
  function normLabel(e) { return String(e.nativePredicate || e.label || e.title || "").trim().toUpperCase(); }
  function semCat(e) { return String(e.semanticCategory || "").trim().toUpperCase(); }
  function predicateOf(e) { return String(e.nativePredicate || e.label || "").trim(); }
  var SCOPED = { "SCOPED_TO": 1, "SCOPED_TO_CLASS": 1, "SCOPED_TO_REGION": 1, "SCOPED_TO_SPECIFIC": 1 };

  function semanticNeighborhood(start) {
    var res = { nodes: {}, edges: {} };
    function addNode(id) { if (id != null) res.nodes[id] = true; }
    function addEdge(e) { if (!e) return; res.edges[e.id] = true; addNode(e.from); addNode(e.to); }
    function isDEValue(e, de) { return typeOf(otherEnd(e, de)) === "Value" && normLabel(e) === "HAS_VALUE"; }
    function schemeCategories(hostId) {
      (edgeIndex[hostId] || []).forEach(function (e) {
        var s = otherEnd(e, hostId);
        if (typeOf(s) !== "AssessmentScheme") return;
        (edgeIndex[s] || []).forEach(function (e2) { if (typeOf(otherEnd(e2, s)) === "AssessmentCategory") addEdge(e2); });
      });
    }
    var t = typeOf(start);
    addNode(start);
    var list = edgeIndex[start] || [];

    if (t === "DataElement") {
      list.forEach(function (e) {
        var nt = typeOf(otherEnd(e, start)), l = normLabel(e);
        if (nt === "Value" && l === "HAS_VALUE") return addEdge(e);
        if ((nt === "FindingClass" || nt === "Diagnosis") && l === "HAS_DATA_ELEMENT") return addEdge(e);
        if (SCOPED[l]) return addEdge(e);
      });
      return res;
    }
    if (t === "Value") {
      var des = [];
      list.forEach(function (e) {
        var nb = otherEnd(e, start), nt = typeOf(nb), l = normLabel(e);
        if (nt === "DataElement" && l === "HAS_VALUE") { addEdge(e); des.push(nb); return; }
        if ((nt === "FindingClass" || nt === "Diagnosis") && l === "HAS_VALUE_CONSTRAINT") addEdge(e);
      });
      des.forEach(function (de) {
        (edgeIndex[de] || []).forEach(function (e) {
          var nt = typeOf(otherEnd(e, de)), l = normLabel(e);
          if (nt === "Value" && l === "HAS_VALUE") return addEdge(e);
          if ((nt === "FindingClass" || nt === "Diagnosis") && l === "HAS_DATA_ELEMENT") addEdge(e);
        });
      });
      return res;
    }
    if (t === "FindingClass") {
      var fdes = [], narrows = {};
      list.forEach(function (e) {
        var nb = otherEnd(e, start), nt = typeOf(nb), l = normLabel(e);
        if (["Diagnosis", "AssessmentScheme", "AssessmentCategory", "AnatomicLocation", "Modality", "Subspecialty", "FindingClass"].indexOf(nt) !== -1) return addEdge(e);
        if (nt === "DataElement" && l === "HAS_DATA_ELEMENT") {
          addEdge(e); fdes.push(nb);
          var nv = e.narrowValues.slice();
          if (!nv.length) {
            var line = String(e.title || "").split("\n").filter(function (x) { return x.indexOf("Narrowed to:") === 0; })[0];
            if (line) {
              var names = line.replace("Narrowed to:", "").split(",").map(function (x) { return x.trim(); });
              allNodes.forEach(function (c) { if (c.type === "Value" && names.indexOf(c.label.trim()) !== -1) nv.push(c.id); });
            }
          }
          if (nv.length) { narrows[nb] = {}; nv.forEach(function (v) { narrows[nb][v] = true; }); }
          return;
        }
        if (nt === "Value" && l === "HAS_VALUE_CONSTRAINT") return addEdge(e);
      });
      fdes.forEach(function (de) {
        (edgeIndex[de] || []).forEach(function (e) {
          if (!isDEValue(e, de)) return;
          var allowed = narrows[de];
          if (!allowed || allowed[otherEnd(e, de)]) addEdge(e);
        });
      });
      schemeCategories(start);
      var patterns = {};
      list.forEach(function (e) { if (e.isPattern) { patterns[otherEnd(e, start)] = true; addEdge(e); } });
      Object.keys(patterns).forEach(function (p) {
        (edgeIndex[p] || []).forEach(function (e) { if (e.isPattern && typeOf(otherEnd(e, p)) === "FindingClass") addEdge(e); });
      });
      return res;
    }
    if (t === "Diagnosis") {
      var ddes = [];
      list.forEach(function (e) {
        var nb = otherEnd(e, start), nt = typeOf(nb), l = normLabel(e);
        if (["Diagnosis", "FindingClass", "AssessmentScheme", "AssessmentCategory", "Modality", "Subspecialty"].indexOf(nt) !== -1) return addEdge(e);
        if (nt === "DataElement" && l === "HAS_DATA_ELEMENT") { addEdge(e); ddes.push(nb); return; }
        if (nt === "Value" && l === "HAS_VALUE_CONSTRAINT") return addEdge(e);
        if (SCOPED[l]) return addEdge(e);
      });
      ddes.forEach(function (de) { (edgeIndex[de] || []).forEach(function (e) { if (isDEValue(e, de)) addEdge(e); }); });
      schemeCategories(start);
      return res;
    }
    if (t === "AssessmentScheme" || t === "AssessmentCategory") {
      list.forEach(function (e) {
        var nt = typeOf(otherEnd(e, start));
        if (["FindingClass", "Diagnosis", "AssessmentScheme", "AssessmentCategory"].indexOf(nt) !== -1) addEdge(e);
      });
      return res;
    }
    list.forEach(addEdge); // Measurement and every other type: direct relationships
    return res;
  }

  function collapseReciprocal(res, start) {
    var rel = Object.keys(res.edges).map(function (id) { return edgeById[id]; });
    var out = {};
    rel.forEach(function (e) { if (e.from === start) out[e.to + "||" + predicateOf(e)] = true; });
    rel.forEach(function (e) {
      if (e.to !== start || !e.inversePredicate) return;
      if (out[e.from + "||" + e.inversePredicate]) delete res.edges[e.id];
    });
    // keep only nodes still reached by a shown edge
    var keep = {}; keep[start] = true;
    Object.keys(res.edges).forEach(function (id) { var e = edgeById[id]; keep[e.from] = true; keep[e.to] = true; });
    res.nodes = keep;
  }

  function addMeasurements(res, start) {
    var t = typeOf(start);
    if (t !== "FindingClass" && t !== "Diagnosis") return;
    (edgeIndex[start] || []).forEach(function (e) {
      if (semCat(e) === "HAS_MEASUREMENT" || normLabel(e) === "HAS_MEASUREMENT") {
        res.edges[e.id] = true; res.nodes[e.from] = true; res.nodes[e.to] = true;
      }
    });
  }

  // ---------- state ----------
  var Graph = null, allNodes = [], allEdges = [], edgeById = {};
  var focus = null;        // { nodes:{}, edges:{}, context:{}, selected:id|null, type:str|null }
  var labelNodes = [];

  function prettyPredicate(e) {
    var p = predicateOf(e) || e.label || "";
    p = p.replace(/^https?:\/\/[^#]*[\/#]/, "");
    p = p.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/_/g, " ").toLowerCase().trim().replace(/^sub class of$/, "subclass of");
    if (e.narrowValues.length || String(e.title).indexOf("Narrowed to:") !== -1) p += " (narrowed)";
    return p || "related to";
  }
  function prettyType(t) { return t.replace(/([a-z])([A-Z])/g, "$1 $2"); }

  function nodeColor(n) {
    if (!focus) return n.color;
    if (focus.nodes[n.id]) return n.color;
    if (focus.context && focus.context[n.id]) return CONTEXT_DIM;
    return DIM;
  }

  function refreshStyles() {
    if (!Graph) return;
    Graph.nodeColor(nodeColor).nodeVisibility(Graph.nodeVisibility())
      .linkVisibility(function (l) { return !l.isPattern || (focus && focus.edges[l.id]); })
      .linkColor(function (l) { return focus ? (focus.edges[l.id] ? (focus.edgeColor && focus.edgeColor[l.id]) || l.color : DIM_LINK) : l.color; })
      .linkWidth(function (l) { return focus && focus.edges[l.id] ? (focus.edgeColor ? 1.4 : 0.6) : 0; })
      .linkOpacity(focus ? 0.9 : 0.28)
      .linkDirectionalArrowLength(function (l) { return focus && focus.edges[l.id] ? 3.5 : 0; })
      .linkDirectionalParticles(function (l) { return focus && focus.selected && focus.edges[l.id] ? 2 : 0; });
    labelNodes = [];
    if (focus && focus.selected) {
      var direct = {};
      Object.keys(focus.edges).forEach(function (id) { var e = edgeById[id]; if (e.from === focus.selected) direct[e.to] = 1; if (e.to === focus.selected) direct[e.from] = 1; });
      var rank = function (n) { return n.id === focus.selected ? 0 : (direct[n.id] ? 1 : 2); };
      labelNodes = allNodes.filter(function (n) { return focus.nodes[n.id]; }).sort(function (a, b) { return rank(a) - rank(b); });
    }
  }

  // Move the camera so a set of concepts fills the visible area, keeping the current viewing angle
  function fitNodes(ids, ms) {
    if (!Graph) return;
    var pts = ids.map(function (id) { return nodeById[id]; }).filter(function (n) { return n && n.x != null; });
    if (!pts.length) return;
    var c = { x: 0, y: 0, z: 0 };
    pts.forEach(function (n) { c.x += n.x; c.y += n.y; c.z += n.z; });
    c.x /= pts.length; c.y /= pts.length; c.z /= pts.length;
    var r = 0; pts.forEach(function (n) { r = Math.max(r, Math.hypot(n.x - c.x, n.y - c.y, n.z - c.z)); });
    var cam = Graph.camera(), t = Graph.controls().target;
    var fov = cam.fov * Math.PI / 180, aspect = Graph.width() / Graph.height();

        var key = hashString(data.nodes.map(function (n) { return n.id; }).join("|") + "#" + data.edges.map(function (e) { return e.from + ">" + e.to; }).join("|"));
        var changed = !good || good.key !== key;
        setStatus((date ? "Map version of " + date : "Latest map") + (good && changed ? " · updated" : " · up to date"));
        saveGood(cache, { data: data, key: key, date: date });
        build(data, key);
      }, function () {
        useGood("You appear to be offline or GitHub is unreachable.");
      });
    });
  });

  if ("serviceWorker" in navigator) {
    addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
